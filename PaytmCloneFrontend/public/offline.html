<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftPay Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #dbeafe 0%, #eff6ff 45%, #f8fafc 100%);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #0f172a;
      }
      .card {
        width: min(560px, 92vw);
        border: 1px solid #bfdbfe;
        border-radius: 16px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.14);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.4rem, 2vw + 1rem, 2rem);
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        SwiftPay is still available with cached pages. Reconnect to sync recent changes and complete online actions.
      </p>
    </main>
  </body>
</html>
