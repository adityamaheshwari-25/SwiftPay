<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="SwiftPay merchant growth animation">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eaf9f3"/>
      <stop offset="100%" stop-color="#e9f0ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0%" stop-color="#0d8c5d"/>
      <stop offset="100%" stop-color="#20b47d"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)"/>
  <rect x="90" y="42" width="540" height="336" rx="30" fill="#ffffff" stroke="#d0e7dd"/>
  <text x="130" y="96" fill="#123f2c" font-size="28" font-family="Arial, sans-serif" font-weight="700">Merchant Weekly + Monthly Growth</text>
  <text x="130" y="127" fill="#4a6f60" font-size="15" font-family="Arial, sans-serif">Business: Nandini Fashion Hub</text>

  <line x1="130" y1="320" x2="590" y2="320" stroke="#c7ded4" stroke-width="2"/>
  <line x1="130" y1="320" x2="130" y2="160" stroke="#c7ded4" stroke-width="2"/>

  <rect x="178" y="260" width="54" height="60" rx="8" fill="url(#bar)">
    <animate attributeName="height" values="35;60;35" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="285;260;285" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="252" y="235" width="54" height="85" rx="8" fill="url(#bar)">
    <animate attributeName="height" values="62;85;62" dur="2.4s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="y" values="258;235;258" dur="2.4s" begin="0.15s" repeatCount="indefinite"/>
  </rect>
  <rect x="326" y="210" width="54" height="110" rx="8" fill="url(#bar)">
    <animate attributeName="height" values="88;110;88" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="232;210;232" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="400" y="180" width="54" height="140" rx="8" fill="url(#bar)">
    <animate attributeName="height" values="115;140;115" dur="2.4s" begin="0.45s" repeatCount="indefinite"/>
    <animate attributeName="y" values="205;180;205" dur="2.4s" begin="0.45s" repeatCount="indefinite"/>
  </rect>
  <rect x="474" y="150" width="54" height="170" rx="8" fill="url(#bar)">
    <animate attributeName="height" values="145;170;145" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="175;150;175" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <text x="182" y="343" fill="#3f6557" font-size="13" font-family="Arial, sans-serif">W1</text>
  <text x="257" y="343" fill="#3f6557" font-size="13" font-family="Arial, sans-serif">W2</text>
  <text x="331" y="343" fill="#3f6557" font-size="13" font-family="Arial, sans-serif">W3</text>
  <text x="405" y="343" fill="#3f6557" font-size="13" font-family="Arial, sans-serif">W4</text>
  <text x="478" y="343" fill="#3f6557" font-size="13" font-family="Arial, sans-serif">Month</text>

  <rect x="525" y="158" width="78" height="34" rx="9" fill="#e8f9f1" stroke="#bfe7d4"/>
  <text x="535" y="180" fill="#1d9f66" font-size="14" font-family="Arial, sans-serif" font-weight="700">+28%</text>
</svg>
