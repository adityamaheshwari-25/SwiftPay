<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="SwiftPay split bill animation">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ecfbff"/>
      <stop offset="100%" stop-color="#e9efff"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f60ea"/>
      <stop offset="100%" stop-color="#0a9dcf"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)"/>
  <rect x="110" y="50" width="500" height="320" rx="30" fill="#ffffff" stroke="#cfe2f7"/>
  <text x="145" y="102" fill="#0f2b66" font-size="29" font-family="Arial, sans-serif" font-weight="700">Trip to Goa</text>
  <text x="145" y="132" fill="#5a7293" font-size="16" font-family="Arial, sans-serif">Split amount: ₹3,600</text>

  <rect x="145" y="156" width="430" height="56" rx="14" fill="#f5f9ff"/>
  <text x="170" y="190" fill="#35527f" font-size="16" font-family="Arial, sans-serif">Aditi</text>
  <text x="480" y="190" fill="#0f60ea" font-size="16" font-family="Arial, sans-serif" font-weight="700">Paid ₹1,200</text>

  <rect x="145" y="220" width="430" height="56" rx="14" fill="#f5f9ff"/>
  <text x="170" y="254" fill="#35527f" font-size="16" font-family="Arial, sans-serif">Karan</text>
  <text x="478" y="254" fill="#c27e06" font-size="16" font-family="Arial, sans-serif" font-weight="700">Pending ₹1,200</text>

  <rect x="145" y="284" width="430" height="56" rx="14" fill="#f5f9ff"/>
  <text x="170" y="318" fill="#35527f" font-size="16" font-family="Arial, sans-serif">Rhea</text>
  <text x="482" y="318" fill="#24a262" font-size="16" font-family="Arial, sans-serif" font-weight="700">Paid ₹1,200</text>

  <rect x="418" y="84" width="157" height="38" rx="11" fill="url(#btn)"/>
  <text x="443" y="108" fill="#ffffff" font-size="15" font-family="Arial, sans-serif" font-weight="700">Remind pending</text>

  <circle cx="555" cy="248" r="7" fill="#ffb400">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
