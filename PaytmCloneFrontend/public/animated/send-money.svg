<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="SwiftPay send money animation">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e6f0ff"/>
      <stop offset="100%" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f60ea"/>
      <stop offset="100%" stop-color="#0ca5d8"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)"/>
  <rect x="110" y="42" width="220" height="336" rx="28" fill="#ffffff" stroke="#cddff8"/>
  <rect x="390" y="72" width="220" height="276" rx="24" fill="#ffffff" stroke="#cddff8"/>
  <rect x="130" y="78" width="180" height="52" rx="14" fill="url(#card)"/>
  <text x="145" y="111" fill="#ffffff" font-size="19" font-family="Arial, sans-serif" font-weight="700">Send to Aarav</text>
  <rect x="130" y="152" width="180" height="84" rx="16" fill="#f2f8ff"/>
  <text x="145" y="182" fill="#47628d" font-size="15" font-family="Arial, sans-serif">Amount</text>
  <text x="145" y="218" fill="#0f2b66" font-size="30" font-family="Arial, sans-serif" font-weight="700">₹ 1,200</text>
  <rect x="130" y="258" width="180" height="44" rx="12" fill="#0f60ea"/>
  <text x="172" y="286" fill="#ffffff" font-size="16" font-family="Arial, sans-serif" font-weight="700">Send now</text>

  <rect x="410" y="98" width="180" height="60" rx="14" fill="#f2f8ff"/>
  <text x="430" y="136" fill="#35527f" font-size="16" font-family="Arial, sans-serif">Transfer status</text>
  <rect x="410" y="170" width="180" height="150" rx="16" fill="#f8fbff"/>
  <text x="430" y="206" fill="#0f2b66" font-size="17" font-family="Arial, sans-serif" font-weight="700">Payment successful</text>
  <text x="430" y="235" fill="#4f678a" font-size="14" font-family="Arial, sans-serif">Aarav received ₹1,200</text>
  <text x="430" y="259" fill="#4f678a" font-size="14" font-family="Arial, sans-serif">in less than 2 seconds</text>

  <circle cx="220" cy="210" r="12" fill="#ffffff" stroke="#91b7f0">
    <animate attributeName="cx" values="220;500;220" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;210;210" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="216" y="215" fill="#0f60ea" font-size="12" font-family="Arial, sans-serif" font-weight="700">
    ₹
    <animate attributeName="x" values="216;496;216" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <path d="M250 210h220" stroke="#74a8f1" stroke-width="2" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
