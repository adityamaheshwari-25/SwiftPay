spring.application.name=PaytmClone
spring.profiles.default=dev

# Database connection values must be supplied by the runtime environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Deployment slots are live applications. Production enables scheduled jobs;
# the staging slot disables them to avoid duplicate settlement/cleanup runs.
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Expose only a minimal health endpoint through Spring Boot Actuator.
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Comma-separated exact origins. Wildcard origins are intentionally unsupported.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.superadmin.email=${SUPERADMIN_EMAIL}
app.superadmin.password=${SUPERADMIN_PASSWORD}

# KYC documents are stored in Azure Blob Storage. Authentication is supplied by
# DefaultAzureCredential (developer login locally, managed identity in Azure).
app.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT}
app.storage.blob.container=${AZURE_STORAGE_BLOB_CONTAINER:kyc-documents}

# Keep the signing key outside source control (Key Vault in Azure).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:10h}
