# Activate this profile with SPRING_PROFILES_ACTIVE=prod.
# Production migrations run as a separate approved operation with migration-only
# credentials. App Service startup must only validate the already-migrated schema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Production must explicitly name trusted frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Keep platform health-probe responses minimal.
management.endpoint.health.show-details=never
