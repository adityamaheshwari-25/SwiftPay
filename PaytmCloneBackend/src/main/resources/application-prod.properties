# Activate this profile with SPRING_PROFILES_ACTIVE=prod.
# Use "update" for the first deployment of the current application. Move to
# Flyway/Liquibase migrations and "validate" before tightening this setting.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Production must explicitly name trusted frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Keep platform health-probe responses minimal.
management.endpoint.health.show-details=never
